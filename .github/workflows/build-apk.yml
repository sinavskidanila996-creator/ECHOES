name: Build ECHOES APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip Android project
        run: |
          unzip -o ECHOES_Android_Build_v2.zip -d android-project

      - name: Build APK
        working-directory: android-project
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ECHOES-APK
          path: android-project/**/build/outputs/apk/debug/*.apk
